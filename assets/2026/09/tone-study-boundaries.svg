<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#111827"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".3"/></filter></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity=".1" stroke="#94a3b8"><path d="M0 150H1600M0 300H1600M0 450H1600M0 600H1600M0 750H1600"/><path d="M200 0V900M400 0V900M600 0V900M800 0V900M1000 0V900M1200 0V900M1400 0V900"/></g>
  <g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">
    <text x="90" y="86" fill="#f8fafc" font-size="46" font-weight="800">이 실험이 측정한 것과 남겨둔 질문</text>
    <text x="90" y="130" fill="#94a3b8" font-size="23">관찰된 4%p 차이를 ‘무례함의 인과 효과’로 바로 읽을 수 없는 이유</text>
    <g stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M330 315H455"/><path d="M720 315H845"/><path d="M1110 315H1235"/></g>
    <g filter="url(#s)">
      <rect x="75" y="205" width="255" height="220" rx="24" fill="#083344" stroke="#22d3ee" stroke-width="3"/>
      <text x="202" y="258" text-anchor="middle" fill="#67e8f9" font-size="24" font-weight="800">기본 문항</text>
      <text x="202" y="323" text-anchor="middle" fill="#f8fafc" font-size="58" font-weight="900">50개</text>
      <text x="202" y="367" text-anchor="middle" fill="#cbd5e1" font-size="21">수학 · 과학 · 역사</text>
      <text x="202" y="399" text-anchor="middle" fill="#94a3b8" font-size="18">객관식 4지선다</text>
      <rect x="455" y="205" width="265" height="220" rx="24" fill="#312e81" stroke="#818cf8" stroke-width="3"/>
      <text x="587" y="258" text-anchor="middle" fill="#c7d2fe" font-size="24" font-weight="800">톤 변형</text>
      <text x="587" y="323" text-anchor="middle" fill="#f8fafc" font-size="58" font-weight="900">5단계</text>
      <text x="587" y="367" text-anchor="middle" fill="#cbd5e1" font-size="21">매우 정중 → 매우 무례</text>
      <text x="587" y="399" text-anchor="middle" fill="#94a3b8" font-size="18">길이·어휘도 함께 변경</text>
      <rect x="845" y="205" width="265" height="220" rx="24" fill="#3b0764" stroke="#c084fc" stroke-width="3"/>
      <text x="977" y="258" text-anchor="middle" fill="#e9d5ff" font-size="24" font-weight="800">주요 평가</text>
      <text x="977" y="323" text-anchor="middle" fill="#f8fafc" font-size="44" font-weight="900">GPT-4o</text>
      <text x="977" y="367" text-anchor="middle" fill="#cbd5e1" font-size="21">각 톤 10회</text>
      <text x="977" y="399" text-anchor="middle" fill="#94a3b8" font-size="18">A·B·C·D 정확도</text>
      <rect x="1235" y="205" width="290" height="220" rx="24" fill="#4c0519" stroke="#fb7185" stroke-width="3"/>
      <text x="1380" y="258" text-anchor="middle" fill="#fecdd3" font-size="24" font-weight="800">관찰</text>
      <text x="1380" y="323" text-anchor="middle" fill="#f8fafc" font-size="58" font-weight="900">+4.0%p</text>
      <text x="1380" y="367" text-anchor="middle" fill="#cbd5e1" font-size="21">80.8% → 84.8%</text>
      <text x="1380" y="399" text-anchor="middle" fill="#94a3b8" font-size="18">평균 추세 · 범위는 겹침</text>
    </g>
    <text x="90" y="500" fill="#f8fafc" font-size="30" font-weight="800">아직 분리되지 않은 변수</text>
    <g>
      <rect x="75" y="535" width="335" height="190" rx="22" fill="#111c2f" stroke="#fbbf24" stroke-width="2"/>
      <text x="105" y="582" fill="#fbbf24" font-size="23" font-weight="800">01 · 문구와 길이</text>
      <text x="105" y="625" fill="#e2e8f0" font-size="20"><tspan x="105" dy="0">정중함만 바뀐 것이 아니라</tspan><tspan x="105" dy="32">접두문 어휘·토큰 수·구조도</tspan><tspan x="105" dy="32">동시에 달라졌다.</tspan></text>
      <rect x="445" y="535" width="335" height="190" rx="22" fill="#111c2f" stroke="#34d399" stroke-width="2"/>
      <text x="475" y="582" fill="#6ee7b7" font-size="23" font-weight="800">02 · 데이터 경로</text>
      <text x="475" y="625" fill="#e2e8f0" font-size="20"><tspan x="475" dy="0">문항·정답이 Deep Research로</tspan><tspan x="475" dy="32">생성됐다. 독립 전문가 검수는</tspan><tspan x="475" dy="32">본문에 상세히 나오지 않는다.</tspan></text>
      <rect x="815" y="535" width="335" height="190" rx="22" fill="#111c2f" stroke="#a78bfa" stroke-width="2"/>
      <text x="845" y="582" fill="#c4b5fd" font-size="23" font-weight="800">03 · 일반화 범위</text>
      <text x="845" y="625" fill="#e2e8f0" font-size="20"><tspan x="845" dy="0">50문항·객관식·주요 모델 하나.</tspan><tspan x="845" dy="32">코드 생성과 자유서술, 다른</tspan><tspan x="845" dy="32">언어·모델은 별도 검증이 필요하다.</tspan></text>
      <rect x="1185" y="535" width="340" height="190" rx="22" fill="#111c2f" stroke="#fb7185" stroke-width="2"/>
      <text x="1215" y="582" fill="#fda4af" font-size="23" font-weight="800">04 · 통계 해석</text>
      <text x="1215" y="625" fill="#e2e8f0" font-size="20"><tspan x="1215" dy="0">10개 톤 쌍을 비교했지만</tspan><tspan x="1215" dy="32">다중 비교 보정 설명은 찾기</tspan><tspan x="1215" dy="32">어렵다. 경계 p값은 주의한다.</tspan></text>
    </g>
    <rect x="75" y="770" width="1450" height="78" rx="20" fill="#172033" stroke="#475569"/>
    <text x="800" y="820" text-anchor="middle" fill="#f8fafc" font-size="26" font-weight="700">욕설을 최적화하지 말고, 프롬프트 표현을 버전 관리하며 대표 평가셋으로 회귀 테스트한다.</text>
  </g>
</svg>
